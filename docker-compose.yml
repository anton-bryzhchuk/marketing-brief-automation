name: marketing-brief-automation

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.5
    entrypoint: ["tini", "--", "/bin/sh", "/project/scripts/import-workflow.sh"]
    depends_on:
      mock:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY:?Copy .env.example to .env}
      MOCK_LLM: ${MOCK_LLM:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5-20250929}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: fs,crypto
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: internal
      N8N_PYTHON_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PAYLOAD_SIZE_MAX: "1"
      N8N_LOG_LEVEL: warn
    volumes:
      - n8n_state:/home/node/.n8n
      - ./data:/data
      - ./workflows:/project/workflows:ro
      - ./scripts:/project/scripts:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 60

  mock:
    image: node:24-alpine
    command: ["node", "/app/server.js"]
    volumes:
      - ./mock:/app:ro
    user: node
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  n8n_state:
